services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snow_admin}
    # 不对宿主机暴露 3306；app 通过 compose 内网用服务名 db 访问。
    # 如需本地调试可临时加： ports: ["127.0.0.1:3306:3306"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    # 生产用 migrate deploy（幂等、非破坏），而非 db push
    command: sh -c "node_modules/.bin/prisma migrate deploy && node server.js"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads:
